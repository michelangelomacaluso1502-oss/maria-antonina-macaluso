<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect width="400" height="600" fill="url(#glow)"/>
  <!-- Stelle -->
  <g fill="#fff8dc" opacity="0.6">
    <circle cx="60" cy="80" r="1"/>
    <circle cx="120" cy="50" r="1.5"/>
    <circle cx="320" cy="90" r="1"/>
    <circle cx="340" cy="160" r="1.5"/>
    <circle cx="80" cy="200" r="1.5"/>
    <circle cx="350" cy="280" r="1"/>
    <circle cx="50" cy="350" r="1.5"/>
    <circle cx="330" cy="420" r="1"/>
    <circle cx="70" cy="480" r="1.5"/>
  </g>
  <!-- Icona moto enduro stilizzata -->
  <g transform="translate(140, 130)" stroke="#ff6b35" stroke-width="2" fill="none">
    <circle cx="30" cy="40" r="18"/>
    <circle cx="100" cy="40" r="18"/>
    <path d="M30 40 L60 20 L100 40"/>
    <path d="M60 20 L70 5 L90 5"/>
    <line x1="48" y1="40" x2="82" y2="40" stroke-width="1.5"/>
  </g>
  <!-- Titolo -->
  <text x="200" y="240" text-anchor="middle" font-family="Playfair Display, serif" font-size="24" fill="#d4af37" font-weight="700">RED BULL</text>
  <text x="200" y="278" text-anchor="middle" font-family="Playfair Display, serif" font-size="22" fill="#ff6b35" font-weight="600">MINAS RIDERS</text>
  <!-- Anno -->
  <text x="200" y="320" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="4" fill="#cfc4b8">2016–IN CORSO</text>
  <!-- Tipo -->
  <text x="200" y="355" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" letter-spacing="3" fill="#cfc4b8" opacity="0.7">SERIE TV · DOCUMENTARIO SPORTIVO</text>
  <!-- Red Bull -->
  <text x="200" y="395" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#ff6b35" font-weight="600">RED BULL MEDIA HOUSE</text>
  <!-- Episodio -->
  <text x="200" y="430" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#cfc4b8" opacity="0.6">Episodio: Bello Horizonte 2017</text>
  <!-- M·M -->
  <text x="200" y="540" text-anchor="middle" font-family="Playfair Display, serif" font-size="32" fill="#d4af37" opacity="0.6">M·M</text>
</svg>
