  <text x="200" y="360" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="4" fill="#cfc4b8">2021</text>
  <!-- Tipo -->
  <text x="200" y="395" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" letter-spacing="3" fill="#cfc4b8" opacity="0.7">CORTOMETRAGGIO · PUBBLICITÀ</text>
  <!-- Sky -->
  <text x="200" y="430" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#ff6b35" font-weight="600">SKY</text>
  <!-- M·M monogramma in basso -->
  <text x="200" y="540" text-anchor="middle" font-family="Playfair Display, serif" font-size="32" fill="#d4af37" opacity="0.6">M·M</text>
