<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#4a1d0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect width="400" height="600" fill="url(#glow)"/>
  <!-- Stelline -->
  <g fill="#fff8dc" opacity="0.7">
    <circle cx="60" cy="80" r="1.5"/>
    <circle cx="120" cy="50" r="1"/>
    <circle cx="320" cy="90" r="1.5"/>
    <circle cx="340" cy="160" r="1"/>
    <circle cx="80" cy="200" r="1"/>
    <circle cx="350" cy="280" r="1.5"/>
    <circle cx="50" cy="350" r="1"/>
    <circle cx="330" cy="420" r="1.5"/>
    <circle cx="70" cy="480" r="1"/>
  </g>
  <!-- Icona pellicola -->
  <g transform="translate(170, 130)" stroke="#ff6b35" stroke-width="2" fill="none">
    <rect x="0" y="0" width="60" height="44" rx="2"/>
    <rect x="6" y="6" width="6" height="4" fill="#ff6b35"/>
    <rect x="18" y="6" width="6" height="4" fill="#ff6b35"/>
    <rect x="30" y="6" width="6" height="4" fill="#ff6b35"/>
    <rect x="42" y="6" width="6" height="4" fill="#ff6b35"/>
    <rect x="6" y="34" width="6" height="4" fill="#ff6b35"/>
    <rect x="18" y="34" width="6" height="4" fill="#ff6b35"/>
    <rect x="30" y="34" width="6" height="4" fill="#ff6b35"/>
    <rect x="42" y="34" width="6" height="4" fill="#ff6b35"/>
    <rect x="14" y="14" width="32" height="16" rx="1"/>
    <path d="M22 18 L22 26 L30 22 Z" fill="#ff6b35"/>
  </g>
  <!-- Titolo -->
  <text x="200" y="240" text-anchor="middle" font-family="Playfair Display, serif" font-size="28" fill="#d4af37" font-weight="600">CREO</text>
  <text x="200" y="278" text-anchor="middle" font-family="Playfair Display, serif" font-size="28" fill="#d4af37" font-weight="600">KITCHENS</text>
  <text x="200" y="316" text-anchor="middle" font-family="Playfair Display, serif" font-style="italic" font-size="18" fill="#ff6b35">Cucine Italiane</text>
